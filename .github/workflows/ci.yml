name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - uses: cycjimmy/semantic-release-action@v8
        with:
          skip_npm_plugin: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
