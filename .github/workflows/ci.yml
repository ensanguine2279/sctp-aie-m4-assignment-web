name: CI/CD Pipeline & Semantic Release

on:
  push:
    branches:
      - main

# Configure GITHUB_TOKEN permissions for all jobs in this workflow
permissions:
  contents: write # Required to push Git tags and releases
  issues: write # Required for semantic-release to comment on issues
  pull-requests: write # Required for semantic-release to comment on PRs

jobs:
  # JOB 1: Lint, test and build. Nothing is tagged unless this passes.
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --if-present skips a script the project doesn't define, instead of failing.
      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present

  # JOB 2: Calculate version and create Git Tag + GitHub Release
  release:
    name: Semantic Release
    needs: test
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      new_release_git_tag: ${{ steps.semantic.outputs.new_release_git_tag }}
      commit_sha: ${{ github.sha }}
      commit_sha_short: ${{ steps.sha.outputs.short }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Run Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v8
        with:
          skip_npm_plugin: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record commit SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Print Semantic Release Outcome & Outputs
        if: always()
        run: |
          echo "=================================================="
          echo "Step Status (Outcome):    ${{ steps.semantic.outcome }}"
          echo "Step Result (Conclusion): ${{ steps.semantic.conclusion }}"
          echo "--------------------------------------------------"
          echo "New Release Published?:   ${{ steps.semantic.outputs.new_release_published }}"
          echo "New Release Version:      ${{ steps.semantic.outputs.new_release_version }}"
          echo "New Git Tag:              ${{ steps.semantic.outputs.new_release_git_tag }}"
          echo "Commit SHA:               ${{ github.sha }}"
          echo "=================================================="

      - name: Add release details to the run summary
        if: always()
        run: |
          {
            echo "### Release"
            echo "| | |"
            echo "|---|---|"
            echo "| Published | ${{ steps.semantic.outputs.new_release_published }} |"
            echo "| Version | ${{ steps.semantic.outputs.new_release_version }} |"
            echo "| Tag | ${{ steps.semantic.outputs.new_release_git_tag }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # JOB 3: Build Docker Image and Publish to Docker Hub
  publish:
    name: Publish Docker Image
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Docker Image Tags
        id: docker_tags
        run: |
          DOCKER_REPO="${{ secrets.DOCKERHUB_USERNAME }}/taskflow-api"
          TAGS="${DOCKER_REPO}:latest,${DOCKER_REPO}:${{ github.sha }}"

          # If semantic release produced a new version/tag, include it in the push
          if [ "${{ needs.release.outputs.new_release_published }}" = "true" ]; then
            TAGS="${TAGS},${DOCKER_REPO}:${{ needs.release.outputs.new_release_version }},${DOCKER_REPO}:${{ needs.release.outputs.new_release_git_tag }}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}

  # Commented out Railway deployment job due to security concerns
