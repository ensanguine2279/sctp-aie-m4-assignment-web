name: CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # Job 1: Verify dependencies and build/test the Next.js code locally
  build:
    name: 1. Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Verify Next.js Build
        run: npm run build
        env:
          # Dummy values so static pre-rendering passes during CI verification
          TASK_SERVICE_URL: https://user-service-production-744c.up.railway.app
          USER_SERVICE_URL: https://task-service-production-f3d1.up.railway.app

  # Job 2: Build the container image and push it to Docker Hub
  publish:
    name: 2. Publish Docker Image
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-nextjs:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-nextjs:${{ steps.version.outputs.version }}

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.version_tag }}
          git push origin ${{ steps.version.outputs.version_tag }}

  # Job 3: Trigger Railway to pull the updated image from Docker Hub and deploy
  deploy:
    name: 3. Deploy to Railway
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Install Railway CLI & Trigger Redeploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli
          railway redeploy --service taskflow-nextjs --yes
